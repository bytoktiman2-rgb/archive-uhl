<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHL ARCHIVE | Історія Трансферів</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { background: #121212; border-bottom: 1px solid #222; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar .logo { font-size: 20px; font-weight: 800; color: #fff; }
        .navbar .logo span { color: #d4af37; }
        .navbar nav { display: flex; gap: 12px; }
        .navbar nav a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 4px; transition: 0.2s; }
        .navbar nav a:hover, .navbar nav a.active { color: #d4af37; background: #1a1a1a; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; flex: 1; width: 100%; }
        .page-header { margin-bottom: 25px; }
        .page-header h1 { font-size: 28px; color: #fff; margin-bottom: 5px; }
        .search-bar { margin-bottom: 20px; }
        .search-bar input { background: #151515; color: #fff; border: 1px solid #262626; padding: 10px 15px; border-radius: 4px; font-size: 14px; width: 100%; }
        .table-responsive { overflow-x: auto; margin-bottom: 25px; }
        .data-table { width: 100%; border-collapse: collapse; background: #151515; border: 1px solid #262626; border-radius: 6px; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; font-size: 14px; }
        .data-table th { background: #1a1a1a; color: #d4af37; font-weight: 700; }
        .data-table tr:hover { background: #1c1c1c; }
        .season-tag { background: #d4af37; color: #000; font-weight: bold; font-size: 11px; padding: 2px 6px; border-radius: 3px; display: inline-block; }
        footer { background: #111; border-top: 1px solid #222; text-align: center; padding: 20px; color: #666; font-size: 13px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">UHL <span>ARCHIVE</span></div>
        <nav>
            <a href="index.html">Головна</a>
            <a href="players.html">Гравці</a>
            <a href="teams.html">Команди</a>
            <a href="seasons.html">Сезони</a>
            <a href="regions.html">Кубок Регіонів</a>
            <a href="transfers.html" class="active">Трансфери</a>
            <a href="events.html">Події та Рекорди</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>🔄 Історія Трансферів УХЛ</h1>
            <p style="color: #888;">Офіційні переходи гравців між командами протягом 1–8 сезонів</p>
        </div>

        <div class="search-bar">
            <input type="text" id="transfer-search" placeholder="🔍 Пошук за гравцем або командою..." oninput="filterTransfers()">
        </div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Гравець</th>
                        <th>Звідки</th>
                        <th>Куди</th>
                        <th>Сезон</th>
                        <th>Деталі / Статус</th>
                    </tr>
                </thead>
                <tbody id="transfers-list">
                    <!-- Завантажується через JS нижче -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>© 2026 UHL Archive. Усі права захищено.</p>
    </footer>

    <script>
        const transfers = [
            { player: "Agbonlahor 11", from: "Мрія", to: "4 раки і толяс", season: "Сезон 3", details: "Офіційний трансфер" },
            { player: "tolyasik", from: "ФК Уєбани", to: "4 раки і толяс", season: "Сезон 2", details: "Перехід капітана" },
            { player: "cancer", from: "COCONUT", to: "Butterflies", season: "Сезон 4", details: "Трансфер бомбардира" },
            { player: "tekashka", from: "COCONUT", to: "Зоря Миронівка", season: "Сезон 7", details: "Оренда" },
            { player: "Din", from: "Мрія", to: "Дніпро", season: "Сезон 6", details: "Трансфер" },
            { player: "gr0nback", from: "DREAMCATCHER", to: "Динамо Київ", season: "Сезон 5", details: "Вільний агент" },
            { player: "Kjamb", from: "ЛНЗ Черкаси", to: "4 раки і толяс", season: "Сезон 7", details: "Трансфер" }
        ];

        function filterTransfers() {
            const q = document.getElementById('transfer-search').value.toLowerCase();
            const filtered = transfers.filter(t => t.player.toLowerCase().includes(q) || t.from.toLowerCase().includes(q) || t.to.toLowerCase().includes(q));
            document.getElementById('transfers-list').innerHTML = filtered.map(t => `
                <tr>
                    <td><strong>${t.player}</strong></td>
                    <td style="color:#e74c3c;">${t.from}</td>
                    <td style="color:#2ecc71;">${t.to}</td>
                    <td><span class="season-tag">${t.season}</span></td>
                    <td style="color:#888;">${t.details}</td>
                </tr>
            `).join('');
        }

        filterTransfers();
    </script>
</body>
</html>
